server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so backend is resolved per-request, not at startup
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;

    # HTML: never cache so users always get fresh index.html
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # Proxy API and Auth to backend
    location ~ ^/(api|auth)/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS: always revalidate so updates are picked up immediately
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Static assets that never change: long cache
    location ~* \.(png|jpg|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
