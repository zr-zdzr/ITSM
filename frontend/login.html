<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITMS — Login</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .card{background:#1e2a3a;border:1px solid rgba(255,255,255,.08);border-radius:20px;
          padding:48px 40px;width:100%;max-width:420px;
          box-shadow:0 25px 60px rgba(0,0,0,.5)}
    .logo{width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#818cf8);
          border-radius:16px;display:flex;align-items:center;justify-content:center;
          font-size:28px;margin:0 auto 24px;text-align:center}
    h1{color:#f1f5f9;font-size:24px;font-weight:700;margin-bottom:6px;text-align:center}
    .subtitle{color:#94a3b8;font-size:14px;margin-bottom:32px;text-align:center}
    .error-msg{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);
               color:#fca5a5;border-radius:10px;padding:12px 16px;font-size:13px;
               margin-bottom:20px;display:none}
    .section-label{color:#64748b;font-size:11px;font-weight:700;
                   text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
    label{display:block;color:#94a3b8;font-size:12px;font-weight:600;
          text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    input[type=text],input[type=password]{width:100%;padding:12px 16px;
      background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:10px;
      color:#f1f5f9;font-size:15px;outline:none;transition:border .2s;margin-bottom:16px}
    input:focus{border-color:#6366f1}
    .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#6366f1,#818cf8);
                 color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;
                 cursor:pointer;transition:opacity .2s;margin-top:4px}
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .footer-text{color:#475569;font-size:12px;margin-top:24px;text-align:center}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🖥️</div>
  <h1>IT Management System</h1>
  <p class="subtitle">Bykea IT — Sign in to continue</p>

  <div class="error-msg" id="err"></div>

  <p class="section-label">Admin Login</p>
  <form id="login-form" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required/>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
    <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
  </form>

  <p class="footer-text">Bykea IT Asset Management System</p>
</div>

<script>
  const errEl = document.getElementById('err');

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    errEl.style.display = 'none';
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        location.href = '/';
      } else {
        const d = await res.json().catch(() => ({}));
        errEl.textContent = d.error || 'Invalid username or password.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    } catch {
      errEl.textContent = 'Network error — is the server running?';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
