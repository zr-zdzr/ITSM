services:
  db:
    image: postgres:16-alpine
    container_name: itms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itms}
      POSTGRES_USER: ${POSTGRES_USER:-itms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itms_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-itms_user} -d ${POSTGRES_DB:-itms}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: itms_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-itms_user}:${POSTGRES_PASSWORD:-itms_secret}@db:5432/${POSTGRES_DB:-itms}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: itms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
